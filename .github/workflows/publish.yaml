name: Publish Staff Portal

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'README.md'

  release:
    types: ['published']

jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
  publish-container-image:
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@add-sentrytoken-as-buildarg
    with:
      image-name: staff-portal
    secrets: inherit

  publish-kustomize-bundles:
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-kustomize-bundle.yaml@v1.6.4
    with:
      bundle-name: ghcr.io/datum-cloud/staff-portal-kustomize
      bundle-path: config
    secrets: inherit 
