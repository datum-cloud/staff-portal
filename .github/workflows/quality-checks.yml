name: Code Checks & Tests

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: production
  CYPRESS_BASE_URL: http://localhost:3000
  CYPRESS_CACHE_FOLDER: ~/.cache/Cypress
  BUN_CACHE: ~/.bun/install/cache
  BUN_VERSION: 1.2.13 # Pin to a specific version for stability
  NODE_VERSION: '22' # Required by Lingui v6 (uses node:fs globSync)

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Dependencies
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.BUN_CACHE }}
            **/node_modules
          key: ${{ runner.os }}-deps-v1-${{ hashFiles('**/bun.lockb', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-v1-

      - name: Install Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Cache Build
        id: cache-build
        uses: actions/cache@v5
        with:
          path: build
          key: build-v1-${{ github.sha }}
          restore-keys: |
            build-v1-

  code-quality:
    needs: setup
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.BUN_CACHE }}
            **/node_modules
          key: ${{ runner.os }}-deps-v1-${{ hashFiles('**/bun.lockb', '**/package.json') }}

      - name: Install Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Run Lint
        run: bun run lint

      - name: Run Format Check
        run: bun run format:check

      - name: Run Typecheck
        run: bun run typecheck

  build:
    needs: code-quality
    name: Build
    runs-on: ubuntu-latest
    if: ${{ !failure() && !cancelled() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.BUN_CACHE }}
            **/node_modules
          key: ${{ runner.os }}-deps-v1-${{ hashFiles('**/bun.lockb', '**/package.json') }}

      - name: Install Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Cache Build
        uses: actions/cache@v5
        with:
          path: build
          key: build-v1-${{ github.sha }}

  unit-tests:
    needs: build
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ !failure() && !cancelled() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Dependencies Cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.BUN_CACHE }}
            **/node_modules
          key: ${{ runner.os }}-deps-v1-${{ hashFiles('**/bun.lockb', '**/package.json') }}

      - name: Restore Build Cache
        uses: actions/cache@v5
        with:
          path: build
          key: build-v1-${{ github.sha }}

      - name: Install Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Setup Cypress
        run: bunx cypress install && bunx cypress verify

      # Unit tests run as Cypress component tests (cypress/component/**).
      # No app/back-end server is needed — the Cypress component runner builds
      # each spec with Vite.
      - name: Run Unit (Component) Tests
        id: unit
        env:
          NODE_ENV: test
          CYPRESS: 'true'
        run: bun run test:unit:prod

      - name: Upload Unit Test Artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-artifacts-${{ github.run_id }}
          path: |
            cypress/videos
            cypress/screenshots
          retention-days: 7
          compression-level: 9
          if-no-files-found: warn

  e2e-smoke:
    needs: build
    name: E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Requires repo secrets to be configured (SESSION_SECRET, ACCESS_TOKEN for a
    # staff user, SUB, API_URL, GRAPHQL_URL, AUTH_OIDC_ISSUER, AUTH_OIDC_CLIENT_ID).
    # Intentionally NOT part of the required `status` gate yet — add it to
    # `status.needs` once the secrets above are set so it becomes blocking.
    if: ${{ !failure() && !cancelled() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Dependencies Cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.BUN_CACHE }}
            **/node_modules
          key: ${{ runner.os }}-deps-v1-${{ hashFiles('**/bun.lockb', '**/package.json') }}

      - name: Restore Build Cache
        uses: actions/cache@v5
        with:
          path: build
          key: build-v1-${{ github.sha }}

      - name: Install Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      # Write a single .env consumed by all later steps: Bun auto-loads it for
      # `bun run start`, and cypress.config.ts loads it via dotenv (for the
      # signSessionCookie task + ACCESS_TOKEN/SUB). This is the single source of
      # truth for test secrets — the Run Smoke Tests step only overrides NODE_ENV,
      # which the global `env: NODE_ENV: production` would otherwise pin.
      - name: Setup E2E Environment
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          SUB: ${{ secrets.SUB }}
          API_URL: ${{ secrets.API_URL }}
          GRAPHQL_URL: ${{ secrets.GRAPHQL_URL }}
          AUTH_OIDC_ISSUER: ${{ secrets.AUTH_OIDC_ISSUER }}
          AUTH_OIDC_CLIENT_ID: ${{ secrets.AUTH_OIDC_CLIENT_ID }}
        run: |
          cat > .env << EOF
          NODE_ENV=test
          CYPRESS=true
          APP_URL=http://localhost:3000
          API_URL=$API_URL
          GRAPHQL_URL=$GRAPHQL_URL
          AUTH_OIDC_ISSUER=$AUTH_OIDC_ISSUER
          AUTH_OIDC_CLIENT_ID=$AUTH_OIDC_CLIENT_ID
          SESSION_SECRET=$SESSION_SECRET
          ACCESS_TOKEN=$ACCESS_TOKEN
          SUB=$SUB
          VERSION=ci-e2e
          LOG_LEVEL=warn
          CYPRESS_BASE_URL=http://localhost:3000
          EOF

      - name: Setup Cypress
        run: bunx cypress install && bunx cypress verify

      - name: Run Smoke Tests
        # NODE_ENV must be set here: the global `env: NODE_ENV: production` is
        # already in process.env, and dotenv/Bun won't override an existing var,
        # so the .env value would be ignored without this. Everything else comes
        # from .env above.
        env:
          NODE_ENV: test
          CYPRESS: 'true'
        run: >-
          bunx start-server-and-test
          'bun run start' http://localhost:3000/_healthz
          'bunx cypress run --spec "cypress/e2e/smoke/**" --config-file cypress.config.ts'

      - name: Upload E2E Smoke Artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-smoke-artifacts-${{ github.run_id }}
          path: |
            cypress/videos
            cypress/screenshots
          retention-days: 7
          if-no-files-found: warn

  status:
    needs: [setup, code-quality, build, unit-tests]
    name: Final Status
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Workflow Status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ Workflow failed because one or more jobs failed"
            exit 1
          elif [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "⚠️ Workflow cancelled because one or more jobs were cancelled"
            exit 1
          else
            echo "✅ All jobs completed successfully"
          fi
