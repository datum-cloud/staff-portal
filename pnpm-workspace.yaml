# pnpm settings for this repo. It is a single package, not a workspace: there
# is no `packages:` list.

# Our own packages are published and consumed across repos on the same day, so
# the one-day release delay must not hold them back.
minimumReleaseAgeExclude:
  - '@datum-cloud/*'

# Only scripts a local install needs: lefthook installs the git hooks, cypress
# fetches its binary, esbuild checks its platform binary. CI and the image
# install with --ignore-scripts and fetch Cypress themselves.
allowBuilds:
  cypress: true
  esbuild: true
  fsevents: false
  lefthook: true
  protobufjs: false

# Versions that overrides must agree with. package.json takes them with
# `catalog:` so each is written once.
catalog:
  '@hono/node-server': 2.1.9
  axios: ^1.20.0
  eslint: ^10.0.0
  monaco-editor: ^0.57.0

overrides:
  react-is: ^19.3.1
  form-data: ^4.0.6
  graphql: 17.1.0
  oxfmt>tinypool: ^2.2.0
  '@graphql-tools/utils': ^12.1.0
  ip-address: ^10.7.6
  '@hey-api/json-schema-ref-parser>js-yaml': ^5.5.0
  axios: 'catalog:'
  follow-redirects: ^1.16.3
  '@humanfs/node': ^0.17.0
  # Also meets @hono/node-ws's peer, which still asks for ^1.19.11.
  '@hono/node-server': 'catalog:'
  qs: ^6.17.1
  '@babel/core': ^7.29.13
  dompurify@<3.4.17: ^3.4.17
  katex: ^0.19.1
  rimraf: ^6.1.4
  # Peers the latest releases have not caught up with; npm ignored them
  # through legacy-peer-deps. Each already ran on these versions under npm.
  '@datum-cloud/activity-ui>monaco-editor': 'catalog:'
  eslint-plugin-import>eslint: 'catalog:'
  eslint-plugin-jsx-a11y>eslint: 'catalog:'
  eslint-plugin-react>eslint: 'catalog:'
