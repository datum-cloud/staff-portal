# pnpm settings for this repo. It is a single package, not a workspace: there
# is no `packages:` list.

# Our own packages are published and consumed across repos on the same day, so
# the one-day release delay must not hold them back.
minimumReleaseAgeExclude:
  - '@datum-cloud/*'

# Only scripts a local install needs: lefthook installs the git hooks, cypress
# fetches its binary, esbuild checks its platform binary. CI and the image
# install with --ignore-scripts and fetch Cypress themselves.
allowBuilds:
  cypress: true
  esbuild: true
  fsevents: false
  lefthook: true
  protobufjs: false

# Versions that overrides must agree with. package.json takes them with
# `catalog:` so each is written once.
catalog:
  axios: ^1.20.0

overrides:
  react-is: ^19.3.1
  form-data: ^4.0.6
  graphql: 17.1.0
  oxfmt>tinypool: ^2.2.0
  '@graphql-tools/utils': ^12.1.0
  ip-address: ^10.7.6
  '@hey-api/json-schema-ref-parser>js-yaml': ^5.5.0
  axios: 'catalog:'
  follow-redirects: ^1.16.3
  '@humanfs/node': ^0.17.0
  react-router-hono-server>@hono/node-server: 2.1.9
  '@hono/vite-dev-server>@hono/node-server': ^2.1.9
  qs: ^6.17.1
  '@babel/core': ^7.29.13
  dompurify@<3.4.17: ^3.4.17
  katex: ^0.19.1
  rimraf: ^6.1.4
