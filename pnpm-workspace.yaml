# pnpm settings for this repo. It is a single package, not a workspace: there
# is no `packages:` list.

# Wait a day before installing a newly published version. Most compromised
# releases are pulled within hours. Our own packages are published and
# consumed across repos on the same day, so the delay must not hold them back.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@datum-cloud/*'

# Reject a version published with weaker provenance than the versions before
# it, such as a release pushed with a stolen token for a package that normally
# publishes from CI.
trustPolicy: no-downgrade
# Each version below was published without provenance after earlier releases
# of the same package had it. Exempt by exact version, so the next release of
# each package is checked again.
trustPolicyExclude:
  # Through remix-auth-oauth2. No later release has provenance.
  - '@mjackson/headers@0.10.0'
  # Through recharts. 2.11.1 and later publish from CI.
  - '@reduxjs/toolkit@2.9.0'
  # Direct. 2.2.2 is the latest and 2.2.1 was published from CI.
  - lefthook@2.2.2
  # Through recharts. 9.3.0 and later publish from CI.
  - react-redux@9.2.0
  # Through @types/node 22, which pins undici-types ~6.21.0.
  - undici-types@6.21.0

# Only scripts a local install needs: lefthook installs the git hooks, cypress
# fetches its binary, esbuild checks its platform binary. CI and the image
# install with --ignore-scripts and fetch Cypress themselves.
allowBuilds:
  cypress: true
  esbuild: true
  fsevents: false
  lefthook: true
  protobufjs: false

# Versions that overrides must agree with. package.json takes them with
# `catalog:` so each is written once.
catalog:
  '@hono/node-server': 2.1.11
  axios: ^1.20.0
  eslint: ^10.0.0
  monaco-editor: ^0.57.0

overrides:
  react-is: ^19.3.1
  form-data: ^4.0.6
  graphql: 17.1.0
  oxfmt>tinypool: ^2.2.0
  '@graphql-tools/utils': ^12.1.0
  ip-address: ^10.7.6
  '@hey-api/json-schema-ref-parser>js-yaml': ^5.5.0
  axios: 'catalog:'
  follow-redirects: ^1.16.3
  '@humanfs/node': ^0.17.0
  # Global, not scoped to react-router-hono-server as under npm: it also meets
  # @hono/node-ws 1.3.1's peer (^1.19.11). npm already ran node-ws on 2.1.9.
  '@hono/node-server': 'catalog:'
  qs: ^6.17.1
  '@babel/core': ^7.29.13
  dompurify@<3.4.17: ^3.4.17
  katex: ^0.19.1
  rimraf: ^6.1.4
  # GHSA-48c2-rrv3-qjmp, through cosmiconfig@7 (babel-plugin-macros).
  yaml@1: ^1.10.3
  # Peers the latest releases have not caught up with; npm ignored them
  # through legacy-peer-deps. Each already ran on these versions under npm.
  '@datum-cloud/activity-ui>monaco-editor': 'catalog:'
  eslint-plugin-import>eslint: 'catalog:'
  eslint-plugin-jsx-a11y>eslint: 'catalog:'
  eslint-plugin-react>eslint: 'catalog:'
